name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Optimize images
        run: |
          # Image optimization step - requires imagemagick or sharp
          # Uncomment if you add image optimization tools
          # find images -name "*.jpg" -o -name "*.png" | xargs -I {} convert {} -quality 85 -strip {}
          echo "Image optimization ready - add imagemagick or sharp for automatic optimization"
      
      - name: Generate cache-busted assets
        run: |
          # Add cache busting hashes to CSS/JS files if needed
          echo "Cache busting ready"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          
      - name: Run Lighthouse CI
        run: |
          echo "Lighthouse CI ready - npm install -g @lhci/cli@0.12.x"
          # lhci autorun --upload.target=temporary-public-storage || echo "LHCI failed"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
